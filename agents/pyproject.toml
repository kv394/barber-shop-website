[project]
name = "kutzapp-agents"
version = "0.1.0"
description = "AI agents for KutzApp barbershop platform, powered by Google Antigravity SDK"
requires-python = ">=3.11"
dependencies = [
    "google-antigravity>=0.1.0",
    "pg8000>=1.31.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
